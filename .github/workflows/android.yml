name: Android CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out Android app and llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes 2>/dev/null) > /dev/null
          "$sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Run unit tests and assemble debug APK
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: bash gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Verify debug APK signature
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          cp "$apk" OpenSLMServer-debug.apk

      - name: Upload debug APK
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: OpenSLMServer-debug.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30

      - name: Run unit tests and assemble release APK
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: bash gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease

      - name: Verify release APK version and alignment
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          version=$("$sdk_tools/aapt" dump badging "$apk" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            printf 'APK version %s does not match tag %s\n' "$version" "$RELEASE_TAG" >&2
            exit 1
          fi
          "$sdk_tools/zipalign" -c -P 16 4 "$apk"

      - name: Upload unsigned release APK
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
