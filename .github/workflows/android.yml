name: Android CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out Android app and llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes 2>/dev/null) > /dev/null
          "$sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Restore optional test signing key
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_TEST_KEYSTORE_BASE64" ]]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey > /dev/null
          fi

      - name: Run unit tests and assemble debug APK
        run: bash gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          cp "$apk" OpenSLMServer-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: OpenSLMServer-debug.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  release:
    name: Publish test APK
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-apk

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          apk=OpenSLMServer-debug.apk
          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            if ! jq -e --arg apk "$apk" '.assets | any(.name == $apk)' <<< "$release" > /dev/null; then
              gh release upload "$RELEASE_TAG" "$apk"
            fi
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease
            fi
          else
            gh release create "$RELEASE_TAG" "$apk" --verify-tag --prerelease --generate-notes
          fi
